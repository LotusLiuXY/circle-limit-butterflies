<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜉蝣圆极限 V2 · Hyperbolic {p,q} Butterflies</title>
<style>
  :root{
    --bg:#f5f2ea; --panel:#fffdf8; --ink:#2b2a26; --sub:#8b8578;
    --line:#e7e1d3; --accent:#a8502c; --accent2:#42614f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  #stage{position:fixed;inset:0 360px 0 0;z-index:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  .presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud"></div>
<div id="panel">
  <h1>蜉蝣圆极限 V2</h1>
  <div class="sub">Escher Circle Limit × 双曲 {p,q} 反射群镶嵌 · 测地线网格 · 全参数可调</div>
  <div class="presets" id="presets"></div>
  <h2>镶嵌 TILING</h2><div id="sec-tiling"></div>
  <h2>全局 GLOBAL</h2><div id="sec-global"></div>
  <h2>运动 MOTION</h2><div id="sec-motion"></div>
  <h2>翅膀 WING</h2><div id="sec-wing"></div>
  <h2>配色 COLOR</h2><div id="sec-color"></div>
  <h2>翅膀轮廓节点编辑（<span id="nodeCount"></span> 节点）</h2>
  <div class="ni">单击选中 · 拖拽移动 · 下方微调坐标 / 切线（Catmull-Rom → 贝塞尔平滑）</div>
  <canvas id="nodeCv" width="300" height="300"></canvas>
  <div id="sec-node"></div>
  <div class="btns">
    <button class="btn" id="resetWing">重置轮廓</button>
    <button class="btn" id="randomize">随机形态</button>
    <button class="btn" id="export">导出 PNG</button>
    <button class="btn" id="copyCfg">复制 JSON</button>
  </div>
</div>

<script>
/* ==========================================================
   单一 config 对象：全部参数集中传参
   命名统一：wing.nodes[i].x / .y / .tangent
             wing.angle / wing.scale / color.stops[]
   无眼睛元素；头大身小；蝴蝶置于顶层
   ========================================================== */
function defaultNodes(){
  return [
    /* 右前翅 forewing · 8 节点（闭合） */
    {x:0.045,y:-0.118,tangent:0.62},
    {x:0.180,y:-0.252,tangent:0.60},
    {x:0.362,y:-0.338,tangent:0.56},
    {x:0.522,y:-0.302,tangent:0.60},
    {x:0.508,y:-0.162,tangent:0.60},
    {x:0.372,y:-0.042,tangent:0.60},
    {x:0.216,y:0.036,tangent:0.60},
    {x:0.070,y:0.014,tangent:0.60},
    /* 右后翅 hindwing · 10 节点（闭合） */
    {x:0.050,y:0.020,tangent:0.60},
    {x:0.196,y:0.056,tangent:0.60},
    {x:0.332,y:0.132,tangent:0.56},
    {x:0.402,y:0.266,tangent:0.60},
    {x:0.312,y:0.402,tangent:0.58},
    {x:0.166,y:0.432,tangent:0.56},
    {x:0.060,y:0.346,tangent:0.60},
    {x:0.018,y:0.222,tangent:0.60},
    {x:0.008,y:0.116,tangent:0.60},
    {x:0.020,y:0.050,tangent:0.60}
  ];
}
const PRESETS = {
  escher:{name:"埃舍尔木刻", cfg:{bg:"#efe8d8", geodesic:{show:true,width:0.6,opacity:0.20,color:"#6b5a3c"},
    face:{show:true,alternateFill:true,colors:["#e6dcc2","#f4efe2"]},
    stops:[{t:0.00,c:"#fbf6e8",a:0.98},{t:0.26,c:"#d9c9a4",a:0.97},{t:0.52,c:"#8d7b57",a:0.97},
           {t:0.76,c:"#3d372c",a:0.97},{t:1.00,c:"#1a1811",a:0.98}], stroke:"#231f16", altShade:34}},
  celadon:{name:"青瓷", cfg:{bg:"#eef2ec", geodesic:{show:true,width:0.6,opacity:0.22,color:"#5f7d70"},
    face:{show:true,alternateFill:true,colors:["#dfeae1","#f2f6f0"]},
    stops:[{t:0.00,c:"#f3f8f1",a:0.95},{t:0.30,c:"#bed6c6",a:0.94},{t:0.55,c:"#82a994",a:0.94},
           {t:0.78,c:"#4f7d6c",a:0.94},{t:1.00,c:"#2f5248",a:0.95}], stroke:"#27453c", altShade:22}},
  morandi:{name:"暮色莫兰迪", cfg:{bg:"#f2efea", geodesic:{show:false,width:0.6,opacity:0.18,color:"#8a8578"},
    face:{show:true,alternateFill:true,colors:["#e6e1d8","#f6f4ee"]},
    stops:[{t:0.00,c:"#efe9dd",a:0.92},{t:0.30,c:"#c3a9a1",a:0.91},{t:0.55,c:"#9b909f",a:0.91},
           {t:0.78,c:"#7c8a83",a:0.91},{t:1.00,c:"#5c6a73",a:0.92}], stroke:"#3c3a35", altShade:20}},
  vermilion:{name:"赤金", cfg:{bg:"#f7f0e2", geodesic:{show:true,width:0.7,opacity:0.24,color:"#8a3b22"},
    face:{show:true,alternateFill:true,colors:["#f2e3c6","#fbf5e9"]},
    stops:[{t:0.00,c:"#fbeec8",a:0.95},{t:0.30,c:"#e9b84d",a:0.94},{t:0.55,c:"#c65b2e",a:0.94},
           {t:0.78,c:"#8e2f26",a:0.94},{t:1.00,c:"#4a1d1c",a:0.95}], stroke:"#3a1512", altShade:26}},
  ink:{name:"水墨", cfg:{bg:"#f6f5f1", geodesic:{show:true,width:0.5,opacity:0.16,color:"#6c6a63"},
    face:{show:false,alternateFill:false,colors:["#e9e7e0","#f7f6f3"]},
    stops:[{t:0.00,c:"#f4f3ef",a:0.90},{t:0.30,c:"#cbc9c2",a:0.88},{t:0.55,c:"#908e87",a:0.88},
           {t:0.78,c:"#4f4d48",a:0.90},{t:1.00,c:"#22211c",a:0.93}], stroke:"#1e1d18", altShade:18}},
  neon:{name:"霓虹（深底）", cfg:{bg:"#0d0f18", geodesic:{show:true,width:0.7,opacity:0.30,color:"#5ad7ff"},
    face:{show:false,alternateFill:false,colors:["#121626","#0d0f18"]},
    stops:[{t:0.00,c:"#e9fbff",a:0.96},{t:0.28,c:"#5ad7ff",a:0.92},{t:0.55,c:"#7a5cff",a:0.92},
           {t:0.78,c:"#ff4fa3",a:0.92},{t:1.00,c:"#241a3a",a:0.94}], stroke:"#0a0c14", altShade:26}}
};
const config = {
  tiling: {
    symmetryP: 6,            // {p,q} 旋转对称阶
    symmetryQ: 4,            // {p,q} 每顶点面数
    depth: 5,                // 反射群递归深度（镶嵌层数）
    rotate: 0,               // 镶嵌整体旋转
    shrink: 0.72,            // 双曲共形收缩强度 (1-|z|²)
    alternate: true,         // 埃舍尔式明暗 / 手性交替
    alternateShade: 28,      // 交替面明暗差
    inset: 0.0,              // 圆边缘留白比例
    geodesic: { show:true, width:0.6, opacity:0.22, color:"#6b5a3c" },
    face: { show:true, alternateFill:true, colors:["#e6dcc2","#f4efe2"] }
  },
  scene: {
    count: 200,              // 蝴蝶数量（受不重叠与最小尺寸约束）
    boundaryRadius: 0.97,    // 圆极限边界（曲率半径映射）
    bgColor: "#efe8d8",
    colorMode: "byRing",     // byRing | byAngle | mixed | mono
    hueSpread: 120,
    seed: 20260828
  },
  butterfly: {
    sizePct: 0.038,          // 蝴蝶大小（屏幕宽 2%–5%）
    minPx: 34,               // 最小像素，确保清晰
    opacity: 0.97,
    speed: 0.5,              // 飞行速度
    loopDuration: 20,        // 循环动画时长（秒）
    displacement: 5,         // 位移范围（px）
    flapSpeed: 1.4,          // 振翅频率
    spreadAngle: 5,          // 翅膀展开角度（度）
    mirror: false,           // 镜像翻转
    layerOrder: "smallTop",  // smallTop | bigTop | byRing
    spawnRate: 0.9,          // 出现频率 / 可见比例
    orient: "tangent"        // tangent | radial | mixed
  },
  wing: {
    angle: -7,               // 翅膀基准角（度）
    scale: 1.0,
    textureDensity: 0.42,    // 纹理密度
    veins: { show:true, width:0.7 },
    light: { angle:128, intensity:0.26 },
    strokeWidth: 1.1,
    nodes: defaultNodes()    // 18 个轮廓控制节点
  },
  color: {
    stops: PRESETS.escher.cfg.stops.map(s=>({...s})),
    backHueShift: 12,        // 正反面色差：色相偏移
    backAlpha: -0.05,        // 反翅透明度差
    backLight: -10,          // 反翅明度差
    strokeColor: "#231f16"
  }
};
/* ========================================================== */

const cv=document.getElementById("cv"), ctx=cv.getContext("2d"), hud=document.getElementById("hud");
let W=0,H=0,CX=0,CY=0,diskR=0;
let faces=[], placed=[], sprites=new Map();
let paused=false, lastFps=0, fpsT=0, fpsN=0;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 庞加莱圆盘 / 双曲 {p,q} 镶嵌 ---------- */
const cadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
const csub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
const cscale=(a,k)=>({x:a.x*k,y:a.y*k});
const cabs=a=>Math.hypot(a.x,a.y);

function orthoCircle(p,q){                       // 过 p,q 且与单位圆正交的圆
  const det=p.x*q.y-p.y*q.x;
  if(Math.abs(det)<1e-8) return null;
  const r1=(1+p.x*p.x+p.y*p.y)/2, r2=(1+q.x*q.x+q.y*q.y)/2;
  const ox=(r1*q.y-p.y*r2)/det, oy=(p.x*r2-r1*q.x)/det;
  return {ox,oy,R2:(ox-p.x)**2+(oy-p.y)**2};
}
function invert(z,C){
  const dx=z.x-C.ox, dy=z.y-C.oy, d2=dx*dx+dy*dy||1e-12;
  const k=C.R2/d2;
  return {x:C.ox+dx*k, y:C.oy+dy*k};
}
function basePolygon(p,q,rot){
  let P=p,Q=q;
  while(1/P+1/Q>=0.5 && Q<40) Q++;               // 保证双曲（1/p+1/q < 1/2）
  const c=Math.cos(Math.PI/P+Math.PI/Q)/Math.cos(Math.PI/P-Math.PI/Q);
  const R0=Math.sqrt(clamp(c,0.02,0.985));
  const v=[];
  for(let j=0;j<P;j++){
    const a=TAU*j/P+rot;
    v.push({x:R0*Math.cos(a), y:R0*Math.sin(a)});
  }
  return v;
}
function faceOf(poly){
  let sx=0,sy=0; poly.forEach(v=>{sx+=v.x;sy+=v.y});
  const c={x:sx/poly.length, y:sy/poly.length};
  let d=0; poly.forEach(v=>{d=Math.max(d,cabs(csub(v,c)))});
  return {poly, c, diam:d*2, s:1-(c.x*c.x+c.y*c.y)};
}
function buildTiling(){
  const t=config.tiling;
  const base=basePolygon(t.symmetryP, t.symmetryQ, t.rotate*Math.PI/180);
  const cap=Math.max(400, config.scene.count*14);
  const out=[], seen=new Set();
  const queue=[{poly:base, d:0}];
  const key=f=>{const c=faceOf(f).c; return Math.round(c.x*4000)+"_"+Math.round(c.y*4000);};
  seen.add(key(base));
  while(queue.length && out.length<cap){
    const {poly,d}=queue.shift();
    const f=faceOf(poly);
    if(cabs(f.c)>0.995) continue;
    out.push(f);
    if(d>=t.depth) continue;
    for(let i=0;i<poly.length;i++){
      const z1=poly[i], z2=poly[(i+1)%poly.length];
      const C=orthoCircle(z1,z2); if(!C||C.R2<1e-6) continue;
      const np=poly.map(v=>invert(v,C));
      const k=key(np);
      if(seen.has(k)) continue;
      seen.add(k);
      queue.push({poly:np, d:d+1});
      if(out.length+queue.length>cap*1.6) break;
    }
  }
  out.sort((a,b)=>cabs(a.c)-cabs(b.c));
  return out;
}
function butterflyPx(s){
  const t=config.tiling;
  return clamp(config.butterfly.sizePct*Math.min(W,H*1.4)*(1-t.shrink+t.shrink*clamp(s,0,1)*1.35),
               config.butterfly.minPx, 260);
}
function layout(){
  faces=buildTiling();
  placed=[];
  const rng=mulberry32(config.scene.seed|0);
  const want=config.scene.count;
  for(let i=0;i<faces.length && placed.length<want;i++){
    const f=faces[i];
    const avail=f.diam*diskR*0.94;
    if(avail<config.butterfly.minPx) continue;            // 保证清晰且不重叠
    const size=Math.min(butterflyPx(f.s), avail);
    let ok=true;
    for(const p of placed){
      if(Math.hypot(p.ux-f.c.x, p.uy-f.c.y)*diskR < (p.size+size)*0.50){ok=false;break;}
    }
    if(!ok) continue;
    const ang=Math.atan2(f.c.y,f.c.x);
    placed.push({
      ux:f.c.x, uy:f.c.y, ang, r:cabs(f.c), s:f.s, size, face:f,
      parity: config.tiling.alternate ? ((i+ (f.poly.length)) % 2) : 0,
      ph1:rng()*TAU, ph2:rng()*TAU, ph3:rng()*TAU, hueSeed:rng()
    });
  }
  sprites.clear();
}

/* ---------- 轮廓：Catmull-Rom(切线权重) → 贝塞尔 ---------- */
function tracePath(g,nodes,U,ox,oy,sx,sy){
  const pts=nodes.map(n=>({x:ox+n.x*U*sx, y:oy+n.y*U*sy, tangent:n.tangent}));
  const n=pts.length;
  g.beginPath(); g.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const t1=clamp(p1.tangent??0.6,0.05,1.2)/6, t2=clamp(p2.tangent??0.6,0.05,1.2)/6;
    g.bezierCurveTo(p1.x+(p2.x-p0.x)*t1, p1.y+(p2.y-p0.y)*t1,
                    p2.x-(p3.x-p1.x)*t2, p2.y-(p3.y-p1.y)*t2, p2.x, p2.y);
  }
  g.closePath();
}
function shadeHex(hex,dl){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round(((n>>16)&255)+dl*2.2),0,255),
        g=clamp(Math.round(((n>>8)&255)+dl*2.2),0,255),
        b=clamp(Math.round((n&255)+dl*2.2),0,255);
  return `rgb(${r},${g},${b})`;
}
function withA(c,a){
  if(c.startsWith("rgb(")) return c.replace("rgb(","rgba(").replace(")",`,${a})`);
  const n=parseInt(c.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function hueRotateHex(hex,deg){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const rad=deg*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  const lum=0.299*r+0.587*g+0.114*b;
  r=clamp(Math.round(lum+(r-lum)*cos-((b-g)/Math.sqrt(3))*sin),0,255);
  g=clamp(Math.round(lum+(g-lum)*cos-((r-b)/Math.sqrt(3))*sin),0,255);
  b=clamp(Math.round(lum+(b-lum)*cos-((g-r)/Math.sqrt(3))*sin),0,255);
  return `rgb(${r},${g},${b})`;
}

/* ---------- 蝴蝶精灵（离屏缓存）---------- */
const S=320, U=S*0.55, OX=S/2, OY=S*0.46, BODY=0.62;   // 蝴蝶纵向占 sprite 比例
function spriteFor(hueKey,parity){
  const k=hueKey+"_"+parity;
  if(sprites.has(k)) return sprites.get(k);
  const c=document.createElement("canvas"); c.width=c.height=S;
  const g=c.getContext("2d");
  const w=config.wing, col=config.color;
  const dl=(parity&&config.tiling.alternate)?-config.tiling.alternateShade:0;
  const base=col.stops.map(s=>({t:s.t,a:s.a,c:shadeHex(s.c,dl*0.55)}));
  const back=col.stops.map(s=>({t:s.t,a:clamp(s.a+col.backAlpha,0.05,1),
      c:shadeHex(hueRotateHex(s.c,col.backHueShift), dl*0.75+col.backLight)}));
  const spread=(w.angle+config.butterfly.spreadAngle)*Math.PI/180;
  function grad(list){
    const gr=g.createLinearGradient(OX-0.12*U,OY-0.42*U,OX+0.10*U,OY+0.44*U);
    list.forEach(s=>gr.addColorStop(clamp(s.t,0,1), withA(s.c,s.a)));
    return gr;
  }
  function drawWing(nodes,side,fill,rot){
    g.save();
    g.translate(OX,OY);
    g.rotate(rot*side);
    g.scale(side*w.scale, w.scale);
    const ns=nodes.map(n=>({x:n.x,y:n.y,tangent:n.tangent}));
    tracePath(g,ns,U,0,0,1,1);
    g.fillStyle=fill; g.fill();
    if(config.wing.veins.show){
      g.save(); g.clip();
      g.strokeStyle="rgba(28,24,18,0.5)"; g.lineWidth=config.wing.veins.width;
      const bx=0.03*U, by=-0.05*U;
      for(let i=2;i<nodes.length;i+=3){
        const nx=nodes[i].x*U, ny=nodes[i].y*U;
        g.beginPath(); g.moveTo(bx,by);
        g.quadraticCurveTo((bx+nx)/2+(ny-by)*0.16,(by+ny)/2-(nx-bx)*0.16,nx*0.95,ny*0.95);
        g.stroke();
      }
      const rng=mulberry32(1000+Math.round(config.wing.textureDensity*777));
      const dots=Math.round(config.wing.textureDensity*95);
      for(let i=0;i<dots;i++){
        const dx=(rng()*0.60-0.02)*U, dy=(rng()*0.92-0.40)*U, rr=(0.006+rng()*0.015)*U;
        g.beginPath(); g.arc(dx,dy,rr,0,TAU);
        g.fillStyle= rng()>0.5 ? "rgba(24,20,14,0.45)" : "rgba(252,248,236,0.72)";
        g.fill();
      }
      g.restore();
    }
    if(config.wing.light.intensity>0.01){
      g.save(); g.clip();
      const la=config.wing.light.angle*Math.PI/180;
      const lg=g.createLinearGradient(OX+Math.cos(la)*S*0.6,OY+Math.sin(la)*S*0.6,
                                      OX-Math.cos(la)*S*0.6,OY-Math.sin(la)*S*0.6);
      lg.addColorStop(0,`rgba(255,252,240,${config.wing.light.intensity})`);
      lg.addColorStop(1,`rgba(8,7,4,${config.wing.light.intensity*0.85})`);
      g.fillStyle=lg; g.fillRect(0,0,S,S);
      g.restore();
    }
    tracePath(g,ns,U,0,0,1,1);
    g.strokeStyle=col.strokeColor; g.lineWidth=config.wing.strokeWidth; g.stroke();
    g.restore();
  }
  const fore=()=>config.wing.nodes.slice(0,8), hind=()=>config.wing.nodes.slice(8);
  drawWing(hind(), 1, grad(back), spread*0.72);
  drawWing(hind(),-1, grad(back), spread*0.72);
  drawWing(fore(), 1, grad(base), spread);
  drawWing(fore(),-1, grad(base), spread);
  /* 躯干：头大身小 · 无眼睛 · 触角（非眼） */
  g.save(); g.translate(OX,OY);
  g.fillStyle=shadeHex(col.strokeColor,26);
  g.beginPath(); g.ellipse(0,0.105*U,0.026*U,0.150*U,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(0,-0.072*U,0.033*U,0.076*U,0,0,TAU); g.fill();
  g.beginPath(); g.arc(0,-0.156*U,0.050*U,0,TAU); g.fill();
  g.strokeStyle="rgba(30,25,18,0.85)"; g.lineWidth=0.010*U; g.lineCap="round";
  g.beginPath(); g.moveTo(-0.020*U,-0.192*U); g.quadraticCurveTo(-0.085*U,-0.300*U,-0.148*U,-0.318*U); g.stroke();
  g.beginPath(); g.moveTo( 0.020*U,-0.192*U); g.quadraticCurveTo( 0.085*U,-0.300*U, 0.148*U,-0.318*U); g.stroke();
  g.restore();
  sprites.set(k,c);
  return c;
}
function hueKeyFor(b){
  const m=config.scene.colorMode, sp=config.scene.hueSpread;
  if(m==="mono") return 0;
  if(m==="byRing") return Math.round((b.r*6*sp/6)%sp)%360;
  if(m==="byAngle") return Math.round(((b.ang/TAU)*sp+360)%360);
  return Math.round(b.hueSeed*sp);
}

/* ---------- 渲染 ---------- */
/* 单位盘内两点 → 正交圆测地弧（追加到当前路径，屏幕坐标） */
function addGeoArc(g,z1,z2){
  const C=orthoCircle(z1,z2); if(!C) return false;
  const R=Math.sqrt(C.R2); if(!isFinite(R)||R<=0) return false;
  const ox=C.ox*diskR, oy=C.oy*diskR, r=R*diskR;
  let a1=Math.atan2(z1.y-C.oy,z1.x-C.ox), a2=Math.atan2(z2.y-C.oy,z2.x-C.ox);
  let d=a2-a1; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
  g.moveTo(ox+r*Math.cos(a1), oy+r*Math.sin(a1));
  g.arc(ox,oy,r,a1,a1+d,d<0);
  return true;
}
/* 静态底图（盘底 + 面填色 + 测地线网格）离屏缓存 */
let bg=null, bgDirty=true;
function renderBackdrop(){
  if(!bg) bg=document.createElement("canvas");
  bg.width=Math.max(1,cv.width); bg.height=Math.max(1,cv.height);
  const g=bg.getContext("2d");
  g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  g.clearRect(0,0,W,H);
  g.save(); g.translate(CX,CY);
  g.beginPath(); g.arc(0,0,diskR,0,TAU);
  g.fillStyle=config.scene.bgColor; g.fill();
  g.restore();
  g.save(); g.translate(CX,CY); g.beginPath(); g.arc(0,0,diskR,0,TAU); g.clip();
  const fc=config.tiling.face;
  if(fc.show){
    for(let i=0;i<faces.length;i++){
      const f=faces[i];
      const col=fc.alternateFill? fc.colors[i%2] : fc.colors[0];
      if(!col) continue;
      g.beginPath();
      for(let j=0;j<f.poly.length;j++) addGeoArc(g, f.poly[j], f.poly[(j+1)%f.poly.length]);
      g.closePath();
      g.fillStyle=col; g.fill();
    }
  }
  const gd=config.tiling.geodesic;
  if(gd.show && gd.opacity>0.005){
    g.save();
    g.globalAlpha=gd.opacity; g.strokeStyle=gd.color; g.lineWidth=gd.width;
    g.beginPath();
    for(const f of faces){
      for(let j=0;j<f.poly.length;j++) addGeoArc(g, f.poly[j], f.poly[(j+1)%f.poly.length]);
    }
    g.stroke();
    g.restore();
  }
  g.restore();
  bgDirty=false;
}
function render(ts){
  const t=ts*0.001;
  ctx.clearRect(0,0,W,H);
  if(bgDirty||!bg) renderBackdrop();
  if(bg) ctx.drawImage(bg,0,0,W,H);
  ctx.save(); ctx.translate(CX,CY); ctx.beginPath(); ctx.arc(0,0,diskR,0,TAU); ctx.clip();
  /* 蝴蝶：置于顶层 */
  const order=[...placed.keys()];
  order.sort((a,b)=>{
    const A=placed[a],B=placed[b],o=config.butterfly.layerOrder;
    if(o==="smallTop") return A.size-B.size;
    if(o==="bigTop")   return B.size-A.size;
    return A.r-B.r;
  });
  const T=config.butterfly.loopDuration, phase=t*config.butterfly.speed/T;
  for(const idx of order){
    const b=placed[idx];
    const k=clamp(b.s,0.05,1.2);
    const disp=config.butterfly.displacement*k;
    const px=b.ux*diskR + Math.sin(TAU*phase+b.ph1)*disp*0.85;
    const py=b.uy*diskR + Math.cos(TAU*phase*0.81+b.ph2)*disp*0.6;
    let rot;
    if(config.butterfly.orient==="radial") rot=Math.atan2(py,px);
    else if(config.butterfly.orient==="mixed") rot=Math.atan2(py,px)+ (b.parity?Math.PI/2:-Math.PI/2);
    else rot=Math.atan2(py,px)+Math.PI/2;
    rot+=Math.sin(TAU*phase+b.ph3)*0.06;
    const flap=Math.sin(TAU*t*config.butterfly.flapSpeed+b.ph2);
    const sy=1-0.11*(flap*0.5+0.5);
    const vis=(Math.sin(TAU*phase+b.ph1)+1)/2;
    const aMul=config.butterfly.spawnRate+(1-config.butterfly.spawnRate)*vis;
    const sp=spriteFor(hueKeyFor(b), b.parity);
    const draw=b.size/BODY;
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(rot);
    if(config.butterfly.mirror ^ !!b.parity) ctx.scale(-1,1);
    ctx.globalAlpha=clamp(config.butterfly.opacity*aMul,0,1);
    ctx.drawImage(sp,-draw/2,-draw/2,draw,draw*sy);
    ctx.restore();
  }
  ctx.restore();
  /* 边界 */
  ctx.save(); ctx.translate(CX,CY);
  ctx.beginPath(); ctx.arc(0,0,diskR,0,TAU);
  ctx.strokeStyle="rgba(70,58,40,0.5)"; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  fpsN++;
  if(ts-fpsT>500){lastFps=Math.round(fpsN*1000/(ts-fpsT));fpsN=0;fpsT=ts;}
  hud.innerHTML=`{p,q} = {${config.tiling.symmetryP},${config.tiling.symmetryQ}} · 镶嵌面 ${faces.length}<br>`
    +`实际放置 ${placed.length} / 目标 ${config.scene.count} 只 · 尺寸 ${placed.length?Math.round(placed[0].size):0}–${placed.length?Math.round(Math.min(...placed.map(p=>p.size))):0}px<br>`
    +`${lastFps} fps${paused?" · 已暂停":""}`;
}

function slider(p,label,obj,key,min,max,step,cb){
  const row=document.createElement("div");row.className="row";

  const i=document.createElement("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=obj[key];
  const v=document.createElement("span");v.className="val";v.textContent=fmt(obj[key],step);
  i.addEventListener("input",()=>{obj[key]=+i.value;v.textContent=fmt(+i.value,step);cb&&cb();});
  row.append(l,i,v);p.appendChild(row);return row;
}
function fmt(x,step){return (+x).toFixed(step<0.05?(step<0.01?3:2):(step<1?2:0));}
function check(p,label,obj,key,cb){
